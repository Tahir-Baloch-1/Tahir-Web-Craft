<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MultiMedia By Using Video and Audio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background: #1f242d;
        }
        nav {
            display: inline-flex;
            padding-top: 2em;
            padding-left: 1.3em;
            align-items: center;
        }
        nav ul li {
            display: inline;
            margin-left: 5em;
        }
        nav ul li a {
            text-decoration: none;
            padding: 1em;
            color: #fff;
            border-radius: 10px;
            transition: 0.3s;
        }
        nav ul li a:hover {
            background-color: #7cf03d;
            color: #1f242d;
            cursor: pointer;
        }
        h1 {
            position: relative;
            font-size: 30px;
            color: #7cf03d;
            font-weight: 900;
        }
        main div {
            display: inline-block;
            margin: 4em 2em;
        }
        video {
            border-radius: 17px;
            height: 300px;
            width: 500px;
            margin-left: 3em;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        video:hover {
            transform: scale(1.02);
            cursor: pointer;
        }
        section div {
            background-color: #1f242d;
            width: 500px;
            height: 300px;
            box-shadow: 2px 2px 10px #919191;
            justify-content: center;
            text-align: center;
            padding: 2em;
            display: inline-block;
            margin: 4em 2em 4em 5em;
            border-radius: 15px;
            vertical-align: top;
        }
        section div h1 {
            color: #fff;
            font-size: 20px;
            margin-bottom: 1em;
        }
        section div p {
            color: beige;
            margin-bottom: 2em;
        }
        audio {
            width: 100%;
            outline: none;
        }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <nav>
        <h1>MultiMedia</h1>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#videos">Videos</a></li>
            <li><a href="#audios">Audios</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    <!-- Videos Section -->
    <main id="videos">
        <div>
            <video controls poster="https://blender.org">
                <source src="https://googleapis.com" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>

        <div>
            <video controls>
                <source src="https://googleapis.com" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>

        <div>
            <video controls>
                <source src="https://googleapis.com" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>

        <div>
            <video controls>
                <source src="https://googleapis.com" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>
    </main>

    <!-- Audios Section -->
    <section id="audios">
        <div>
            <h1>Relaxing Piano Track</h1>
            <p>Enjoy this calm and soothing instrumental audio track directly in your browser.</p>
            <audio controls>
                <source src="https://soundhelix.com" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
        </div>

        <div>
            <h1>Upbeat Electronic Beat</h1>
            <p>Listen to this energetic background music track for coding and focus.</p>
            <audio controls>
                <source src="https://soundhelix.com" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
        </div>
    </section>

</body>
</html>
